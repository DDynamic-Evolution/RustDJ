[package]
name = "rustdj"
version = "0.23.1"
edition = "2024"
description = "A Rust-based DJ application"
rust-version = "1.88"

[dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
rfd = "=0.15.4"
midir = "=0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustfft = "=6.4.1"
flate2 = "=1.1.10"
mp3lame-encoder = "=0.2.5"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[build-dependencies]
find-msvc-tools = "=0.1.15"

[profile.release]
lto = "thin"
strip = true
